[flake8]
# Maximum line length.
# Phase 9A: increased from default 79 to 120 to accommodate long string
# literals in the knowledge corpus and docstrings. All existing code
# fits within this limit.
max-line-length = 120

# Exclude generated / virtual environments from linting.
exclude =
    .git,
    __pycache__,
    venv,
    .venv,
    migrations,
    .pytest_cache,
    instance,
