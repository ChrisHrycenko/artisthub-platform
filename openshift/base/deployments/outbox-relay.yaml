# openshift/base/deployments/outbox-relay.yaml
#
# ArtistHub outbox relay Deployment
#
# Phase 8E — Workload Deployments
#
# ─────────────────────────────────────────────────────────────────────────
# Replica count: 1 (HARD LIMIT for Phase 8E)
# ─────────────────────────────────────────────────────────────────────────
# WHY EXACTLY ONE REPLICA:
#
#   The outbox relay polls the event_outbox table for rows with
#   status='pending', publishes each row to Kafka, then marks the row
#   as status='published'.
#
#   The current relay implementation uses a plain SELECT query without
#   SELECT FOR UPDATE SKIP LOCKED.  If two relay replicas ran concurrently,
#   both could SELECT the same pending rows in the same polling interval and
#   publish duplicate Kafka events.
#
#   Downstream consumers (analytics, notification) use ProcessedEvent
#   deduplication which would absorb duplicate events correctly, but:
#     1. Duplicate production is wasteful and non-deterministic.
#     2. The dead-letter topic could receive spurious entries.
#     3. It is harder to reason about correctness without locking.
#
#   Phase 8F+: Add SELECT FOR UPDATE SKIP LOCKED to enable multiple relay
#   replicas for higher throughput.  Until then, replicas: 1 is the safe
#   and correct setting.
#
# ─────────────────────────────────────────────────────────────────────────
# No Service — the relay is a push-only worker.
# ─────────────────────────────────────────────────────────────────────────
# The relay writes to PostgreSQL and publishes to Confluent Cloud Kafka.
# No other pod calls into the relay.  No Service or Route is created.
#
# ─────────────────────────────────────────────────────────────────────────
# Heartbeat probe — /tmp/relay_alive
# ─────────────────────────────────────────────────────────────────────────
# The relay writes /tmp/relay_alive on every main-loop iteration (every
# OUTBOX_POLL_INTERVAL seconds = 5s default).  Probes check this file:
#
#   startupProbe:  test -f /tmp/relay_alive
#     Up to 120s for first heartbeat (12 failures × 10s)
#
#   livenessProbe: find /tmp -name relay_alive -mmin -2
#     File must be newer than 2 minutes.  Triggers restart if the relay
#     loop hangs (e.g. deadlock on DB connection, unrecoverable exception).
#     120s window (2 failures × 60s) tolerates transient Kafka rebalances
#     without false restarts.
#
# ─────────────────────────────────────────────────────────────────────────
# Environment variables received:
# ─────────────────────────────────────────────────────────────────────────
# From ConfigMap (artisthub-config):
#   FLASK_ENV, KAFKA_SECURITY_PROTOCOL, KAFKA_SASL_MECHANISMS,
#   OUTBOX_POLL_INTERVAL, OUTBOX_BATCH_SIZE, KAFKA_SCHEMAS_DIR,
#   DB_POOL_SIZE, DB_MAX_OVERFLOW
#
# From Secret (artisthub-secrets):
#   SECRET_KEY, DATABASE_URL, KAFKA_BOOTSTRAP_SERVERS,
#   CONFLUENT_API_KEY, CONFLUENT_API_SECRET,
#   SCHEMA_REGISTRY_URL, SCHEMA_REGISTRY_API_KEY, SCHEMA_REGISTRY_API_SECRET
#
# Not needed by this workload (loaded anyway via envFrom but ignored):
#   KAFKA_CONSUMER_GROUP, NOTIF_CONSUMER_GROUP (consumer groups only)
#   ANALYTICS_MAX_RETRIES, ANALYTICS_RETRY_BACKOFF (analytics consumer only)
#   NOTIF_MAX_RETRIES, NOTIF_RETRY_BACKOFF (notification consumer only)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-relay
  namespace: artisthub
  labels:
    app.kubernetes.io/name: outbox-relay
    app.kubernetes.io/component: outbox-relay
    app.kubernetes.io/part-of: artisthub-platform
    app.kubernetes.io/managed-by: kustomize
  annotations:
    description: >
      Transactional outbox relay: polls event_outbox, publishes to Confluent
      Cloud Kafka. Single replica until SELECT FOR UPDATE SKIP LOCKED is
      implemented.
spec:
  # IMPORTANT: Do not increase replicas without first implementing
  # SELECT FOR UPDATE SKIP LOCKED in app/services/outbox_relay.py.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: outbox-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outbox-relay
        app.kubernetes.io/component: outbox-relay
        app.kubernetes.io/part-of: artisthub-platform
    spec:
      # ------------------------------------------------------------------ #
      # Identity                                                             #
      # ------------------------------------------------------------------ #
      serviceAccountName: sa-outbox-relay
      automountServiceAccountToken: false

      # ------------------------------------------------------------------ #
      # Pod-level security context                                           #
      # ------------------------------------------------------------------ #
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      # ------------------------------------------------------------------ #
      # Containers                                                           #
      # ------------------------------------------------------------------ #
      containers:
        - name: outbox-relay
          image: artisthub-backend:latest
          imagePullPolicy: IfNotPresent
          # Override the default gunicorn CMD with the relay entry point.
          command: ["python", "run_relay.py"]

          # ---------------------------------------------------------------- #
          # Container-level security context                                  #
          # ---------------------------------------------------------------- #
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault

          # ---------------------------------------------------------------- #
          # Environment                                                       #
          # ---------------------------------------------------------------- #
          envFrom:
            - configMapRef:
                name: artisthub-config
            - secretRef:
                name: artisthub-secrets

          # ---------------------------------------------------------------- #
          # Probes — heartbeat file                                           #
          # /tmp is always writable (kernel-provided, not inside /app)       #
          # ---------------------------------------------------------------- #
          startupProbe:
            exec:
              command: ["test", "-f", "/tmp/relay_alive"]
            failureThreshold: 12
            periodSeconds: 10

          livenessProbe:
            exec:
              command:
                - find
                - /tmp
                - -name
                - relay_alive
                - -mmin
                - "-2"
            periodSeconds: 60
            failureThreshold: 2
            timeoutSeconds: 5

          # No readinessProbe — this pod is not behind a Service.

          # ---------------------------------------------------------------- #
          # Resource requests/limits (Phase 8C defaults)                     #
          # Tune from Phase 8H metrics.                                       #
          # ---------------------------------------------------------------- #
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

      restartPolicy: Always
