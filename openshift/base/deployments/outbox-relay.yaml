# openshift/base/deployments/outbox-relay.yaml
#
# ArtistHub outbox relay Deployment
#
# Phase 8F — replicas: 2 (safe after SELECT FOR UPDATE SKIP LOCKED)
#
# ─────────────────────────────────────────────────────────────────────────
# Replica count: 2 (Phase 8F — SKIP LOCKED implemented)
# ─────────────────────────────────────────────────────────────────────────
# WHY TWO REPLICAS ARE NOW SAFE:
#
#   The relay (app/services/outbox_relay.py) now uses:
#
#     SELECT ... FOR UPDATE SKIP LOCKED LIMIT batch_size
#
#   within a transaction that commits BEFORE Kafka produce begins.
#   This gives PostgreSQL row-level locks to each replica for its
#   exclusive batch of rows.  When replica 2 runs its SELECT in the
#   same polling window, it SKIPs the rows already locked by replica 1
#   and claims a different disjoint batch.
#
#   At-least-once delivery guarantee:
#     If a relay crashes after the Kafka broker acknowledges a message
#     but before the PostgreSQL UPDATE (published_at = now()) commits,
#     the row remains pending and is re-published on the next cycle.
#     This is safe because downstream consumers use ProcessedEvent
#     (event_id, consumer_group) deduplication to absorb duplicates.
#
#   SQLite note:
#     FOR UPDATE SKIP LOCKED is not used on SQLite (development/test).
#     Only one relay instance should run against SQLite.  The production
#     cluster always uses PostgreSQL.
#
#   Scale beyond 2:
#     Additional replicas are safe from a correctness standpoint.
#     Phase 8I (KEDA) may scale the relay based on event_outbox backlog
#     depth via a Prometheus query.  See openshift/README.md §Relay Scale-out.
#
# ─────────────────────────────────────────────────────────────────────────
# No Service — the relay is a push-only worker.
# ─────────────────────────────────────────────────────────────────────────
# The relay writes to PostgreSQL and publishes to Confluent Cloud Kafka.
# No other pod calls into the relay.  No Service or Route is created.
#
# ─────────────────────────────────────────────────────────────────────────
# Heartbeat probe — /tmp/relay_alive
# ─────────────────────────────────────────────────────────────────────────
# The relay writes /tmp/relay_alive on every main-loop iteration (every
# OUTBOX_POLL_INTERVAL seconds = 5s default).  Probes check this file:
#
#   startupProbe:  test -f /tmp/relay_alive
#     Up to 120s for first heartbeat (12 failures × 10s)
#
#   livenessProbe: find /tmp -name relay_alive -mmin -2
#     File must be newer than 2 minutes.  Triggers restart if the relay
#     loop hangs (e.g. deadlock on DB connection, unrecoverable exception).
#     120s window (2 failures × 60s) tolerates transient Kafka rebalances
#     without false restarts.
#
# ─────────────────────────────────────────────────────────────────────────
# Environment variables received:
# ─────────────────────────────────────────────────────────────────────────
# From ConfigMap (artisthub-config):
#   FLASK_ENV, KAFKA_SECURITY_PROTOCOL, KAFKA_SASL_MECHANISMS,
#   OUTBOX_POLL_INTERVAL, OUTBOX_BATCH_SIZE, KAFKA_SCHEMAS_DIR,
#   DB_POOL_SIZE, DB_MAX_OVERFLOW
#
# From Secret (artisthub-secrets):
#   SECRET_KEY, DATABASE_URL, KAFKA_BOOTSTRAP_SERVERS,
#   CONFLUENT_API_KEY, CONFLUENT_API_SECRET,
#   SCHEMA_REGISTRY_URL, SCHEMA_REGISTRY_API_KEY, SCHEMA_REGISTRY_API_SECRET
#
# Not needed by this workload (loaded anyway via envFrom but ignored):
#   KAFKA_CONSUMER_GROUP, NOTIF_CONSUMER_GROUP (consumer groups only)
#   ANALYTICS_MAX_RETRIES, ANALYTICS_RETRY_BACKOFF (analytics consumer only)
#   NOTIF_MAX_RETRIES, NOTIF_RETRY_BACKOFF (notification consumer only)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-relay
  namespace: artisthub
  labels:
    app.kubernetes.io/name: outbox-relay
    app.kubernetes.io/component: outbox-relay
    app.kubernetes.io/part-of: artisthub-platform
    app.kubernetes.io/managed-by: kustomize
  annotations:
    description: >
      Transactional outbox relay: polls event_outbox, publishes to Confluent
      Cloud Kafka. Phase 8F: 2 replicas safe via SELECT FOR UPDATE SKIP LOCKED.
      Phase 8H: exposes Prometheus metrics on port 9090 via prometheus_client.
spec:
  # Phase 8F: replicas raised from 1 → 2.
  # SELECT FOR UPDATE SKIP LOCKED in app/services/outbox_relay.py ensures
  # each replica claims a disjoint batch of outbox rows, preventing duplicate
  # Kafka publishes.  See the module docstring for the full transaction model.
  replicas: 2
  # Rolling strategy for the relay:
  # maxSurge=1: briefly runs 3 relay instances during a deploy.
  # maxUnavailable=1: one old replica can terminate before the new one is ready.
  # SKIP LOCKED ensures the extra relay replica during surge cannot duplicate
  # any row that is still being processed by an old relay instance.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: outbox-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outbox-relay
        app.kubernetes.io/component: outbox-relay
        app.kubernetes.io/part-of: artisthub-platform
    spec:
      # ------------------------------------------------------------------ #
      # Identity                                                             #
      # ------------------------------------------------------------------ #
      serviceAccountName: sa-outbox-relay
      automountServiceAccountToken: false
      # ------------------------------------------------------------------ #
      # Pod annotations — Prometheus scrape discovery                       #
      # ------------------------------------------------------------------ #

      # ------------------------------------------------------------------ #
      # Pod-level security context                                           #
      # ------------------------------------------------------------------ #
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      # ------------------------------------------------------------------ #
      # Containers                                                           #
      # ------------------------------------------------------------------ #
      containers:
        - name: outbox-relay
          image: artisthub-backend:latest
          imagePullPolicy: IfNotPresent
          # Override the default gunicorn CMD with the relay entry point.
          command: ["python", "run_relay.py"]
          # Phase 8H: metrics port for Prometheus scraping by PodMonitor.
          # Workers have no HTTP ingress Service; port is exposed directly
          # to the openshift-monitoring namespace via allow-ocp-monitoring policy.
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP

          # ---------------------------------------------------------------- #
          # Container-level security context                                  #
          # ---------------------------------------------------------------- #
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault

          # ---------------------------------------------------------------- #
          # Environment                                                       #
          # ---------------------------------------------------------------- #
          envFrom:
            - configMapRef:
                name: artisthub-config
            - secretRef:
                name: artisthub-secrets

          # ---------------------------------------------------------------- #
          # Probes — heartbeat file                                           #
          # /tmp is always writable (kernel-provided, not inside /app)       #
          # ---------------------------------------------------------------- #
          startupProbe:
            exec:
              command: ["test", "-f", "/tmp/relay_alive"]
            failureThreshold: 12
            periodSeconds: 10

          livenessProbe:
            exec:
              command:
                - find
                - /tmp
                - -name
                - relay_alive
                - -mmin
                - "-2"
            periodSeconds: 60
            failureThreshold: 2
            timeoutSeconds: 5

          # No readinessProbe — this pod is not behind a Service.

          # ---------------------------------------------------------------- #
          # Resource requests/limits (Phase 8C defaults)                     #
          # Tune from Phase 8H metrics.                                       #
          # ---------------------------------------------------------------- #
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

      restartPolicy: Always
