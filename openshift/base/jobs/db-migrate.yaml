# openshift/base/jobs/db-migrate.yaml
#
# ArtistHub database migration Job
#
# Phase 8E — Workload Deployments
#
# ─────────────────────────────────────────────────────────────────────────
# Purpose
# ─────────────────────────────────────────────────────────────────────────
# Runs Flask-Migrate (`flask db upgrade`) to apply all pending Alembic
# revisions before application workloads start serving traffic.
#
# This Job MUST complete successfully before the backend, outbox-relay,
# analytics-consumer, and notification-consumer Deployments are healthy.
# If the Job fails, the Deployments will error (DB schema mismatch) and
# their readiness probes will fail, keeping them out of traffic rotation.
#
# ─────────────────────────────────────────────────────────────────────────
# Why a Job, not pod init containers
# ─────────────────────────────────────────────────────────────────────────
# A Job runs once, completes, and is not restarted unless the cluster
# operator re-applies it.  This avoids running migrations on every pod
# restart (which would be the case with init containers on every pod).
#
# Multiple pod restarts during a rolling deploy will not trigger multiple
# migration runs.  Alembic's alembic_version table makes `flask db upgrade`
# idempotent — if the target revision is already applied, the command exits
# 0 without making changes.  However, to keep the sequence clean, the Job
# is designed to run once per deploy.
#
# ─────────────────────────────────────────────────────────────────────────
# Enforced rollout order
# ─────────────────────────────────────────────────────────────────────────
# Kubernetes does not natively block Deployment rollout on Job completion.
# Operators MUST follow this order when applying Phase 8E manifests:
#
#   1. kubectl apply -k openshift/overlays/production
#      (applies namespace, SA, RBAC, ConfigMap, Secret, NetworkPolicies,
#       Services, and all Deployments)
#   2. kubectl wait --for=condition=complete job/db-migrate \
#        --timeout=120s -n artisthub
#   3. If the Job fails: kubectl logs job/db-migrate -n artisthub
#      then fix the migration error before proceeding.
#   4. Only then verify Deployments: kubectl rollout status deployment/backend
#
# Future phases (8G+) may add Argo Rollouts or a pre-sync hook to enforce
# this ordering programmatically.
#
# ─────────────────────────────────────────────────────────────────────────
# Image: same as backend (contains Flask-Migrate + Alembic)
# ─────────────────────────────────────────────────────────────────────────
# The backend image contains:
#   - Python 3.11 + Flask + Flask-Migrate + SQLAlchemy
#   - backend/ source (including migrations/ directory)
#   - kafka/schemas/ Avro files
# Running `flask db upgrade` inside this image applies the Alembic
# revisions from backend/migrations/ to the PostgreSQL database.
#
# ─────────────────────────────────────────────────────────────────────────
# backoffLimit: 2
# ─────────────────────────────────────────────────────────────────────────
# Allows 3 total attempts (initial + 2 retries).  If migrations fail
# 3 times, the Job enters Failed state and the deployment must be
# investigated manually.  Failing fast prevents a corrupt partial migration
# from being silently retried indefinitely.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: artisthub
  labels:
    app.kubernetes.io/name: db-migrate
    app.kubernetes.io/component: db-migrate
    app.kubernetes.io/part-of: artisthub-platform
    app.kubernetes.io/managed-by: kustomize
  annotations:
    description: >
      One-shot Flask-Migrate job. Runs `flask db upgrade` to apply all pending
      Alembic revisions to the production PostgreSQL database before application
      workloads become healthy.
spec:
  # Do not automatically restart a completed Job.
  # Set ttlSecondsAfterFinished to auto-clean the Job resource after 24h.
  ttlSecondsAfterFinished: 86400

  # Allow 3 total attempts before declaring failure.
  backoffLimit: 2

  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrate
        app.kubernetes.io/component: db-migrate
        app.kubernetes.io/part-of: artisthub-platform
    spec:
      # ------------------------------------------------------------------ #
      # Identity — use sa-backend (shares RBAC access to ConfigMap/Secret) #
      # ------------------------------------------------------------------ #
      serviceAccountName: sa-backend
      automountServiceAccountToken: false

      # ------------------------------------------------------------------ #
      # Pod-level security context                                           #
      # ------------------------------------------------------------------ #
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      # ------------------------------------------------------------------ #
      # Job restartPolicy                                                    #
      # Never: on failure a new pod is created (up to backoffLimit).        #
      # OnFailure would restart the same pod — use Never to get a fresh     #
      # environment on each attempt.                                         #
      # ------------------------------------------------------------------ #
      restartPolicy: Never

      containers:
        - name: db-migrate
          image: artisthub-backend:latest
          imagePullPolicy: IfNotPresent

          # Run flask db upgrade instead of the default gunicorn CMD.
          # FLASK_APP is set explicitly to locate the application factory.
          command: ["flask", "db", "upgrade"]

          # ---------------------------------------------------------------- #
          # Container-level security context                                  #
          # ---------------------------------------------------------------- #
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault

          # ---------------------------------------------------------------- #
          # Environment                                                       #
          # ---------------------------------------------------------------- #
          # The Job needs DATABASE_URL (from Secret) and FLASK_ENV (from
          # ConfigMap) to locate the database and select ProductionConfig.
          # All other config keys are loaded from envFrom but are ignored
          # by the migration command.
          envFrom:
            - configMapRef:
                name: artisthub-config
            - secretRef:
                name: artisthub-secrets

          # FLASK_APP must point to the application factory entry point.
          # This env var takes precedence over envFrom values.
          env:
            - name: FLASK_APP
              value: "run:app"

          # ---------------------------------------------------------------- #
          # Resources — migrations are short-lived and CPU-light             #
          # ---------------------------------------------------------------- #
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
