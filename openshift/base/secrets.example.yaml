# openshift/base/secrets.example.yaml
#
# Secret reference template — NOT a real secret manifest.
#
# ============================================================
# NEVER commit real secret values to git.
# This file contains ONLY placeholder values to document the
# required Secret schema.  Real values are injected via:
#   - HashiCorp Vault + Vault Agent Injector (preferred)
#   - Bitnami Sealed Secrets (controller encrypts on-cluster)
#   - External Secrets Operator (pulls from Vault/AWS SM/GCP SM)
#   - Manual: `kubectl create secret generic artisthub-secrets --from-env-file=.env`
# ============================================================
#
# The actual secrets.yaml file (with real values) must NEVER be
# committed. It is excluded by .gitignore:
#   openshift/secrets/
#
# To create the Secret manually for development/staging:
#   cp openshift/base/secrets.example.yaml /tmp/artisthub-secrets.yaml
#   # Edit /tmp/artisthub-secrets.yaml — fill in real base64 values
#   kubectl apply -f /tmp/artisthub-secrets.yaml -n artisthub
#   rm /tmp/artisthub-secrets.yaml    # do not leave on disk
#
# To generate base64-encoded values:
#   echo -n "your-value-here" | base64
#
# Key inventory:
#   SECRET_KEY              Flask session signing key (random 32-byte hex)
#   DATABASE_URL            Full PostgreSQL DSN including password
#   KAFKA_BOOTSTRAP_SERVERS Confluent Cloud bootstrap (host:port)
#   CONFLUENT_API_KEY       Confluent Cloud API key (cluster-level)
#   CONFLUENT_API_SECRET    Confluent Cloud API secret
#   SCHEMA_REGISTRY_URL     Confluent Cloud Schema Registry endpoint
#   SCHEMA_REGISTRY_API_KEY Schema Registry API key
#   SCHEMA_REGISTRY_API_SECRET Schema Registry API secret
---
apiVersion: v1
kind: Secret
metadata:
  name: artisthub-secrets
  namespace: artisthub
  labels:
    app.kubernetes.io/name: artisthub-secrets
    app.kubernetes.io/part-of: artisthub-platform
  annotations:
    description: >
      ArtistHub credential store.  All values are base64-encoded.
      NEVER commit real values — this file contains placeholders only.
      See openshift/base/secrets.example.yaml for documentation.
type: Opaque
data:
  # Flask session signing key.
  # Generate: python3 -c "import secrets; print(secrets.token_hex(32))"
  # Then:     echo -n "<generated-value>" | base64
  SECRET_KEY: REPLACE_WITH_BASE64_ENCODED_SECRET_KEY

  # Full PostgreSQL connection string.
  # Format: postgresql://<user>:<password>@<host>:<port>/<dbname>?sslmode=require
  # Example (do not commit real passwords):
  #   postgresql://artisthub:CHANGE_ME@postgresql-svc:5432/artisthub?sslmode=require
  DATABASE_URL: REPLACE_WITH_BASE64_ENCODED_DATABASE_URL

  # Confluent Cloud Kafka bootstrap servers.
  # Format: pkc-XXXXX.us-east1.gcp.confluent.cloud:9092
  KAFKA_BOOTSTRAP_SERVERS: REPLACE_WITH_BASE64_ENCODED_BOOTSTRAP_SERVERS

  # Confluent Cloud cluster API key and secret (for Kafka producer/consumer).
  CONFLUENT_API_KEY: REPLACE_WITH_BASE64_ENCODED_CONFLUENT_API_KEY
  CONFLUENT_API_SECRET: REPLACE_WITH_BASE64_ENCODED_CONFLUENT_API_SECRET

  # Confluent Cloud Schema Registry endpoint.
  # Format: https://psrc-XXXXX.us-east-1.aws.confluent.cloud
  SCHEMA_REGISTRY_URL: REPLACE_WITH_BASE64_ENCODED_SCHEMA_REGISTRY_URL

  # Confluent Cloud Schema Registry API key and secret.
  SCHEMA_REGISTRY_API_KEY: REPLACE_WITH_BASE64_ENCODED_SR_API_KEY
  SCHEMA_REGISTRY_API_SECRET: REPLACE_WITH_BASE64_ENCODED_SR_API_SECRET
