# openshift/base/serviceaccounts.yaml
#
# Least-privilege ServiceAccounts — one per workload class.
#
# Design principles:
#   - Each Deployment uses its own ServiceAccount (no shared default SA).
#   - automountServiceAccountToken is false for all SAs.  None of the
#     ArtistHub workloads need to call the Kubernetes/OpenShift API at
#     runtime.  Disabling the token mount reduces the attack surface.
#   - No ClusterRole or privileged SCC is requested.
#   - The restricted SCC (OpenShift default) is sufficient for all
#     workloads after the Phase 8B GID-0 hardening.
#
# OpenShift will automatically assign a UID from the project's UID range
# (e.g. 1000680000–1000689999) to pods using these ServiceAccounts.
# The GID-0 filesystem permissions from Phase 8B ensure write access
# for any assigned UID without needing anyuid SCC.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-backend
  namespace: artisthub
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: artisthub-platform
  annotations:
    description: "ServiceAccount for the Flask/gunicorn backend API"
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-frontend
  namespace: artisthub
  labels:
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: artisthub-platform
  annotations:
    description: "ServiceAccount for the nginx-unprivileged frontend"
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-outbox-relay
  namespace: artisthub
  labels:
    app.kubernetes.io/component: outbox-relay
    app.kubernetes.io/part-of: artisthub-platform
  annotations:
    description: "ServiceAccount for the transactional outbox relay worker"
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-analytics-consumer
  namespace: artisthub
  labels:
    app.kubernetes.io/component: analytics-consumer
    app.kubernetes.io/part-of: artisthub-platform
  annotations:
    description: "ServiceAccount for the Kafka analytics consumer"
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-notification-consumer
  namespace: artisthub
  labels:
    app.kubernetes.io/component: notification-consumer
    app.kubernetes.io/part-of: artisthub-platform
  annotations:
    description: "ServiceAccount for the Kafka notification consumer"
automountServiceAccountToken: false
