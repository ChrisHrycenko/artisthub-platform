<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fan Login — ArtistHub</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">ArtistHub</a>
      <nav class="site-nav" id="site-nav">
        <a href="browse-artists.html">Artists</a>
        <a href="browse-releases.html">Releases</a>
        <a href="browse-merch.html">Merch</a>
        <span id="nav-guest">
          <a href="artist-login.html">Artist Login</a>
          <a href="fan-login.html">Fan Login</a>
        </span>
        <span id="nav-authed" style="display:none;">
          <a href="#" id="nav-dashboard">Dashboard</a>
          <a href="#" id="nav-logout">Sign Out</a>
        </span>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="auth-card">

          <h1 class="auth-title">Fan Sign In</h1>
          <p class="auth-subtitle">
            New here?
            <a href="fan-register.html">Create a fan account →</a>
          </p>

          <!-- Inline alert — shown on error -->
          <div id="login-alert" class="alert" style="display:none;"></div>

          <form id="login-form" novalidate>

            <div class="form-group">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                class="form-input"
                placeholder="you@example.com"
                required
                autocomplete="email"
              />
            </div>

            <div class="form-group">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                class="form-input"
                placeholder="••••••••"
                required
                autocomplete="current-password"
              />
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
              Sign In
            </button>

          </form>

          <p class="auth-alt-link">
            Artist? <a href="artist-login.html">Sign in as an artist →</a>
          </p>

        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>ArtistHub MVP &copy; 2024 — Built for independent musicians.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/fan-login.js"></script>

</body>
</html>
