<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse Releases — ArtistHub</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">ArtistHub</a>
      <nav class="site-nav" id="site-nav">
        <a href="browse-artists.html">Artists</a>
        <a href="browse-releases.html">Releases</a>
        <a href="browse-merch.html">Merch</a>
        <span id="nav-guest">
          <a href="artist-login.html">Artist Login</a>
          <a href="fan-login.html">Fan Login</a>
        </span>
        <span id="nav-authed" style="display:none;">
          <a href="#" id="nav-dashboard">Dashboard</a>
          <a href="#" id="nav-logout">Sign Out</a>
        </span>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">

        <div class="browse-header">
          <div>
            <h1>Browse Releases</h1>
            <p class="section-sub">
              Stream independently released music from artists on ArtistHub.
            </p>
          </div>
          <div class="browse-controls">
            <!-- Genre filter dropdown — populated by browse-releases.js -->
            <select
              id="genre-select"
              class="search-box"
              aria-label="Filter by genre"
            >
              <option value="">All Genres</option>
            </select>
            <input
              type="search"
              id="search-input"
              class="search-box"
              placeholder="Search releases…"
              aria-label="Search releases by title"
            />
          </div>
        </div>

        <p id="results-summary" class="results-summary" aria-live="polite"></p>

        <!-- Release type filter chips — rendered by browse-releases.js -->
        <div id="type-chips" class="chip-group" aria-label="Filter by type"></div>

        <!-- Release cards grid -->
        <div id="releases-grid" class="card-grid releases-grid">
          <div class="card placeholder">
            <div class="placeholder-img"></div>
            <p class="placeholder-text">Loading releases…</p>
          </div>
        </div>

        <div id="pagination" class="pagination"></div>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>ArtistHub MVP &copy; 2024 — Built for independent musicians.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/browse-releases.js"></script>

</body>
</html>
