<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse Artists — ArtistHub</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">ArtistHub</a>
      <nav class="site-nav" id="site-nav">
        <a href="browse-artists.html">Artists</a>
        <a href="browse-releases.html">Releases</a>
        <a href="browse-merch.html">Merch</a>
        <span id="nav-guest">
          <a href="artist-login.html">Artist Login</a>
          <a href="fan-login.html">Fan Login</a>
        </span>
        <span id="nav-authed" style="display:none;">
          <a href="#" id="nav-dashboard">Dashboard</a>
          <a href="#" id="nav-logout">Sign Out</a>
        </span>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">

        <!-- ============================================================
             Page heading + genre filter
        ============================================================ -->
        <div class="browse-header">
          <div>
            <h1>Browse Artists</h1>
            <p class="section-sub">Discover independent musicians on ArtistHub.</p>
          </div>
          <div class="browse-controls">
            <input
              type="search"
              id="search-input"
              class="search-box"
              placeholder="Search by name or genre…"
              aria-label="Search artists"
            />
          </div>
        </div>

        <!-- ============================================================
             Results summary — updated by browse-artists.js
        ============================================================ -->
        <p id="results-summary" class="results-summary" aria-live="polite"></p>

        <!-- ============================================================
             Artist grid — populated by browse-artists.js
        ============================================================ -->
        <div id="artists-grid" class="card-grid" aria-label="Artist listings">
          <div class="card placeholder" id="loading-card">
            <div class="placeholder-img"></div>
            <p class="placeholder-text">Loading artists…</p>
          </div>
        </div>

        <!-- ============================================================
             Pagination controls — rendered by browse-artists.js
        ============================================================ -->
        <div id="pagination" class="pagination" aria-label="Pagination"></div>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>ArtistHub MVP &copy; 2024 — Built for independent musicians.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/browse-artists.js"></script>

</body>
</html>
