# docker/nginx.conf
#
# nginx configuration for ArtistHub.
#
# Two responsibilities:
#   1. Serve the frontend/ static SPA files from /usr/share/nginx/html.
#   2. Proxy all /api/* requests to the Flask backend container (backend:5000).
#
# In development  → docker-compose up serves this config automatically.
# In production   → swap the server_name and add TLS (Let's Encrypt / ACME).

server {
    listen 80;
    server_name localhost;

    # ----------------------------------------------------------------- #
    # Frontend static files                                               #
    # ----------------------------------------------------------------- #
    root /usr/share/nginx/html;
    index index.html;

    # Cache static assets (CSS, JS) for 1 day in dev; bump to 1y in prod.
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — any path that does not match a real file returns
    # index.html so the in-page routing can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ----------------------------------------------------------------- #
    # API proxy to Flask / gunicorn                                       #
    # ----------------------------------------------------------------- #
    location /api/ {
        # `backend` is the Docker Compose service name; Docker's internal
        # DNS resolves it to the backend container's IP automatically.
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;

        # Forward original client info so Flask can log real IPs.
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Needed for Flask-Login session cookies to work cross-service.
        proxy_set_header   Cookie           $http_cookie;

        # Allow slightly larger request bodies (merch/post images in future).
        client_max_body_size 5m;
    }
}
