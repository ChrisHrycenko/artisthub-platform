# docker/nginx-frontend.conf
#
# nginx configuration for the ArtistHub frontend container.
#
# Phase 8B — OpenShift / nginx-unprivileged
# ==========================================
# The base image (nginxinc/nginx-unprivileged) runs as UID 101 and
# listens on port 8080 by default.  All paths below are within
# /usr/share/nginx/html (read-only static content) and nginx's
# pre-configured writable temp directories:
#   /tmp/nginx/         — client body buffer
#   /var/cache/nginx/   — proxy cache (pre-set group-writable by image)
#   /var/run/           — PID file (pre-set writable by image)
#
# The nginx-unprivileged image pre-configures all of these to be
# writable without root, so no additional chown/chmod is needed here.
#
# Two responsibilities:
#   1. Serve the frontend/ static SPA files from /usr/share/nginx/html.
#   2. Proxy all /api/* requests to the Flask backend container (backend:5000).
#
# Port: 8080 (unprivileged — does not require CAP_NET_BIND_SERVICE).
# OpenShift Route will TLS-terminate externally and forward to port 8080.

server {
    listen 8080;
    server_name localhost;

    # ----------------------------------------------------------------- #
    # Frontend static files                                               #
    # ----------------------------------------------------------------- #
    root /usr/share/nginx/html;
    index index.html;

    # Cache static assets for 1 day in dev; bump to 1y in prod.
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — any path that does not match a real file returns
    # index.html so client-side routing can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ----------------------------------------------------------------- #
    # API proxy to Flask / gunicorn                                       #
    # ----------------------------------------------------------------- #
    location /api/ {
        # Use a variable for the upstream so nginx resolves it lazily at
        # request time via Docker's embedded DNS resolver (127.0.0.11).
        # Without this, nginx resolves `backend` at startup and fails if
        # the backend container is not yet reachable (e.g. in standalone
        # testing or when the backend container restarts).
        #
        # 127.0.0.11 is Docker's embedded DNS server address — present in
        # all Docker bridge networks.  In OpenShift, replace with the
        # cluster DNS (kube-dns / CoreDNS), typically 172.30.0.10.
        resolver 127.0.0.11 valid=5s;
        set $backend_upstream http://backend:5000;

        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;

        # Forward original client info so Flask logs real IPs.
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Needed for Flask-Login session cookies to work cross-service.
        proxy_set_header   Cookie           $http_cookie;

        # Allow slightly larger request bodies (merch/post images in future).
        client_max_body_size 5m;
    }
}
