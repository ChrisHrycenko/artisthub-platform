# docker/nginx-openshift.conf
#
# nginx configuration for the ArtistHub frontend container on OpenShift.
#
# Phase 8E — OpenShift DNS resolver
# ===================================
# Differs from nginx-frontend.conf (Docker Compose) in one key way:
#   - resolver directive uses CoreDNS (kube-dns) at 172.30.0.10
#     instead of Docker's embedded DNS (127.0.0.11).
#   - Upstream hostname uses the OpenShift Service DNS name
#     backend-svc.artisthub.svc.cluster.local instead of the Compose
#     service name "backend".
#
# The `set $backend_upstream` variable forces runtime DNS resolution on
# every request rather than at nginx startup, preventing startup failures
# when backend pods are temporarily unavailable.
#
# Port: 8080 (unprivileged — no CAP_NET_BIND_SERVICE required).
# OpenShift Route (Phase 8F) will TLS-terminate externally → port 8080.

server {
    listen 8080;
    server_name localhost;

    # ----------------------------------------------------------------- #
    # Frontend static files                                               #
    # ----------------------------------------------------------------- #
    root /usr/share/nginx/html;
    index index.html;

    # Cache static assets for 1 day; bump to 1y after adding content hashes.
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — any path that does not match a real file returns
    # index.html so client-side routing can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ----------------------------------------------------------------- #
    # API proxy to Flask / gunicorn                                       #
    # ----------------------------------------------------------------- #
    location /api/ {
        # CoreDNS resolver for OpenShift / Kubernetes.
        # 172.30.0.10 is the OpenShift cluster DNS (kube-dns) address.
        # valid=5s caches the DNS result for 5 seconds, balancing lookup
        # overhead with Service IP change propagation time.
        resolver 172.30.0.10 valid=5s;

        # Use the full Service DNS name so the resolver directive above
        # catches it.  A plain variable prevents nginx from resolving
        # the upstream at startup (avoids "host not found" errors when
        # backend pods are not yet ready).
        set $backend_upstream http://backend-svc.artisthub.svc.cluster.local:5000;

        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;

        # Forward original client info so Flask logs real IPs.
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Required for Flask-Login session cookies to propagate correctly.
        proxy_set_header   Cookie            $http_cookie;

        # Allow slightly larger request bodies (merch/post images in future).
        client_max_body_size 5m;
    }
}
